name: Chopin 4.14 内核构建

env:
  TZ: Asia/Shanghai

  # ── 内核源码 ──
  KERNEL_NAME: Chopin-A16-KVM-Proton-release
  KERNEL_REPO: https://github.com/wildhunte777/kernel_mt6893
  KERNEL_BRANCH: chopin_kvm
  KERNEL_DEVICE: chopin
  DEFCONFIG_NAME: chopin_defconfig

  # ── 工具链 ──
  # 实际工具链（AOSP Clang 12.0.5 r416183b，纯 LLVM 构建）

  # ── AnyKernel3 ──
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  ANYKERNEL_BRANCH: master

  # ── 构建参数 ──
  ARCH: arm64
  OUT_DIR: "${{ github.workspace }}/out"

  # ── KBUILD 伪装配置 ──
  FAKE_EXTRAVERSION: ${{ inputs.fake_extraversion }}
  FAKE_COMPILER: ${{ inputs.fake_compiler }}

  # ── ccache ──
  CCACHE_KEY: ccache-chopin-4.14-a16

on:
  workflow_dispatch:
    inputs:
      ksu_enabled:
        description: '是否集成 SukiSU-Ultra (Manual Hook)'
        required: true
        type: boolean
        default: true

      susfs_enabled:
        description: '是否集成 SUSFS (隐藏模块/路径/挂载，需 SukiSU-Ultra)'
        required: true
        type: boolean
        default: true

      droidspaces_enabled:
        description: '是否集成 Droidspaces 支持（应用官方补丁并写入所需内核配置）'
        required: true
        type: boolean
        default: true

      use_anykernel:
        description: '是否使用 AnyKernel3 打包刷入包（关闭时仅上传 Image）'
        required: true
        type: boolean
        default: true

      fake_enabled:
        description: '是否进行编译伪装（总开关；开启后各伪装项留空即保留真实值）'
        required: true
        type: boolean
        default: false

      ccache_enabled:
        description: '是否启用 ccache 加速编译'
        required: true
        type: boolean
        default: true

      ccache_update:
        description: '更新 ccache 缓存（更改编译配置或需要刷新缓存时开启）'
        required: true
        type: boolean
        default: false

      release:
        description: '是否发布到 GitHub Releases'
        required: true
        type: boolean
        default: true

      kernel_suffix:
        description: '自定义内核后缀（留空使用默认，开头勿加连字符）'
        required: false
        type: string
        default: ''

      kbuild_build_user:
        description: '伪装编译用户名 (KBUILD_BUILD_USER)，留空则保留真实值, builder'
        required: false
        type: string
        default: ''

      kbuild_build_host:
        description: '伪装编译主机名 (KBUILD_BUILD_HOST)，留空则保留真实值, android-builder'
        required: false
        type: string
        default: ''

      kbuild_build_timestamp:
        description: '伪装编译时间 (KBUILD_BUILD_TIMESTAMP)，留空则保留真实值, Fri Mar 28 13:14:00 CST 2025'
        required: false
        type: string
        default: ''

      kbuild_build_version:
        description: '伪装编译版本 (KBUILD_BUILD_VERSION)，留空则保留真实值'
        required: false
        type: string
        default: '1'

      fake_extraversion:
        description: '伪装内核版本号后缀 (FAKE_EXTRAVERSION)，留空则保留真实值, -g88e8616a5866'
        required: false
        type: string
        default: ''

      fake_compiler:
        description: '伪装编译器信息 (FAKE_COMPILER)，留空则保留真实值'
        required: false
        type: string
        default: ''

jobs:
  # ============================================================
  # 构建内核
  # ============================================================
  build:
    name: 构建内核
    runs-on: ubuntu-22.04
    steps:

      # ── 1. 初始化构建环境 ──
      - name: 初始化构建环境
        id: setup_env
        run: |
          echo "builddate=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

          sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libfl-dev curl git ccache python2 python2-dev zip unzip

      # ── 2. 克隆内核源码 ──
      - name: 克隆内核源码
        run: |
          git clone --recursive --depth=1 -j $(nproc) \
            --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} \
            ${{ env.KERNEL_NAME }}

      # ── 3. 获取工具链 (AOSP Clang 12) ──
      - name: 获取工具链
        run: |
          mkdir -p aosp-clang
          CLANG_URL="https://github.com/seriaTvT/kernel-builder-chopin/releases/download/Toolchain/linux-x86-bd96dfe349c962681f0e5388af874c771ef96670-clang-r416183b.tar.gz"
          for i in 1 2 3; do
            wget -qO clang.tar.gz "$CLANG_URL" && break || { echo "下载失败，重试 $i/3..."; sleep 15; }
          done
          tar -xf clang.tar.gz -C aosp-clang
          echo "${{ github.workspace }}/aosp-clang/bin" >> $GITHUB_PATH

      # ── 4. 准备 AnyKernel3 ──
      - name: 准备 AnyKernel3
        if: inputs.use_anykernel
        run: |
          git clone --recursive --depth=1 -j $(nproc) \
            --branch ${{ env.ANYKERNEL_BRANCH }} \
            ${{ env.ANYKERNEL_REPO }} \
            AnyKernel3

          rm -f AnyKernel3/anykernel.sh
          cat << 'EOF' > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=Chopin Custom Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }

          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

      # ── 5. 配置并恢复 ccache ──
      - name: 配置 ccache
        if: inputs.ccache_enabled
        run: |
          ccache -o compression=true -o cache_dir=$HOME/.ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 载入 ccache 缓存
        if: inputs.ccache_enabled && !inputs.ccache_update
        uses: actions/cache/restore@v4
        id: ccache_restore
        with:
          path: ~/.ccache
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_KEY }}-

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_enabled && inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          PREFIX="${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-"
          mapfile -t KEYS < <(gh cache list -R ${{ github.repository }} \
            --key "$PREFIX" --limit 100 --json key --jq '.[].key')
          if [ ${#KEYS[@]} -eq 0 ]; then
            echo "未找到匹配前缀的旧缓存（前缀: $PREFIX）。"
          else
            for k in "${KEYS[@]}"; do
              if gh cache delete "$k" -R ${{ github.repository }}; then
                echo "成功删除旧缓存: $k"
              else
                echo "删除失败或已被清理: $k"
              fi
            done
          fi

      # ── 6. 集成 SukiSU-Ultra ──
      - name: 集成 SukiSU-Ultra
        if: inputs.ksu_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          if [ -d "./KernelSU" ]; then
            rm -rf "./KernelSU"
          fi
          if [ -d "./drivers/kernelsu" ]; then
            rm -rf "./drivers/kernelsu"
          fi

          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki

          echo -e "CONFIG_KSU=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KSU_MANUAL_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KPM=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KALLSYMS=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KALLSYMS_ALL=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KALLSYMS_ABSOLUTE_PERCPU=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          cat arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

      # ── 6.5 集成 SUSFS (kernel-4.14 分支最新 = v1.5.5) ──
      - name: 集成 SUSFS (4.14 最新分支)
        if: inputs.susfs_enabled && inputs.ksu_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail

          SUSFS_SRC="${{ github.workspace }}/susfs4ksu"
          PATCH_FILE="$SUSFS_SRC/kernel_patches/50_add_susfs_in_kernel-4.14.patch"

          echo "[+] 下载 SUSFS kernel-4.14 分支最新 (预期 v1.5.5) ..."
          rm -rf "$SUSFS_SRC"
          git clone --depth=1 --branch "kernel-4.14" \
            https://gitlab.com/simonpunk/susfs4ksu.git "$SUSFS_SRC"

          echo "[+] 复制 SUSFS 核心文件 ..."
          cp -v "$SUSFS_SRC/kernel_patches/fs/susfs.c" fs/
          cp -v "$SUSFS_SRC/kernel_patches/include/linux/susfs.h" include/linux/
          if [ -f "$SUSFS_SRC/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -v "$SUSFS_SRC/kernel_patches/include/linux/susfs_def.h" include/linux/
          fi

          echo "[+] 应用内核侧补丁 ..."
          if git apply --check "$PATCH_FILE" >/dev/null 2>&1; then
            git apply "$PATCH_FILE"
            echo "[+] 内核补丁应用成功"
          else
            echo "::warning::内核补丁无法干净应用，强制应用 ..."
            git apply --reject "$PATCH_FILE" || true
            find . -name "*.rej" -type f -delete
            find . -name "*.orig" -type f -delete
            echo "[+] 内核补丁处理完成"
          fi

          echo "[+] 检查是否需要 KernelSU 侧补丁 ..."
          KSU_PATCH="$SUSFS_SRC/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            if git apply --check "$KSU_PATCH" >/dev/null 2>&1; then
              git apply "$KSU_PATCH"
              echo "[+] KernelSU 侧补丁应用成功"
            else
              echo "::warning::KernelSU 侧补丁无法干净应用，尝试强制应用 ..."
              git apply --reject "$KSU_PATCH" || true
              find . -name "*.rej" -type f -delete
              find . -name "*.orig" -type f -delete
              echo "[+] KernelSU 侧补丁处理完成"
            fi
          else
            echo "[+] 未找到 KernelSU 侧补丁，跳过"
          fi

          echo "[+] 修改 fs/Makefile ..."
          if ! grep -q "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
          fi

          echo "[+] 导出 susfs_try_umount ..."
          if grep -q "^static void susfs_try_umount(uid_t uid)" fs/susfs.c; then
            sed -i 's/^static void susfs_try_umount(uid_t uid)/void susfs_try_umount(uid_t uid)/' fs/susfs.c
          fi
          if ! grep -q "extern void susfs_try_umount(uid_t uid)" include/linux/susfs.h; then
            echo "extern void susfs_try_umount(uid_t uid);" >> include/linux/susfs.h
          fi

          echo "[+] 写入 SUSFS 内核配置 ..."
          DEFCONFIG="arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          if ! grep -q "CONFIG_KSU_SUSFS=y" "$DEFCONFIG" 2>/dev/null; then
            {
              echo ""
              echo "# ===== SUSFS support (4.14 non-GKI) ====="
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            } >> "$DEFCONFIG"
          fi

      # ── 6.8 应用标准 KernelSU 非 GKI Manual Hook（指针版本）──
      - name: 应用标准 KernelSU 非 GKI Hook
        if: inputs.ksu_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          echo "[+] 应用标准 KernelSU 非 GKI Manual Hook（指针版本）..."

          # ============================================================
          # 1. fs/exec.c: do_execveat_common → ksu_handle_execveat
          # ============================================================
          if [ -f "fs/exec.c" ]; then
            if ! grep -q "ksu_handle_execveat" fs/exec.c; then
              python3 << 'PYEOF'
          import re

          with open('fs/exec.c', 'r') as f:
              content = f.read()

          # 在 do_execveat_common 函数体的 { 后插入 hook
          # 注意：使用指针版本签名（标准 KernelSU / SukiSU-Ultra）
          pattern = r'(static\s+int\s+do_execveat_common\s*\([^)]*\)\s*\{)'
          hook = r'''\1
          #ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
                      void *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
                       void *argv, void *envp, int *flags);
          #endif
          '''

          new_content = re.sub(pattern, hook, content, count=1)
          if new_content == content:
              print("::warning::fs/exec.c: 未找到 do_execveat_common 插入点")
          else:
              # 在 return __do_execve_file 前插入调用
              call_pattern = r'(return\s+__do_execve_file\s*\(\s*fd\s*,\s*filename\s*,\s*argv\s*,\s*envp\s*,\s*flags\s*,\s*NULL\s*\);)'
              call_hook = r'''#ifdef CONFIG_KSU
          \tif (unlikely(ksu_execveat_hook))
          \t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          \telse
          \t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          #endif
          \t\1'''
              new_content = re.sub(call_pattern, call_hook, new_content, count=1)
              with open('fs/exec.c', 'w') as f:
                  f.write(new_content)
              print("[+] fs/exec.c: 已插入 ksu_handle_execveat (指针版本)")
          PYEOF
            else
              echo "[+] fs/exec.c: ksu_handle_execveat 已存在，跳过"
            fi
          fi

          # ============================================================
          # 2. fs/open.c: do_faccessat → ksu_handle_faccessat
          # ============================================================
          if [ -f "fs/open.c" ]; then
            if ! grep -q "ksu_handle_faccessat" fs/open.c; then
              python3 << 'PYEOF'
          import re

          with open('fs/open.c', 'r') as f:
              content = f.read()

          # 4.17+ 内核有 do_faccessat；4.17 之前需要修改 faccessat 系统调用
          pattern = r'(long\s+do_faccessat\s*\([^)]*\)\s*\{)'
          if re.search(pattern, content):
              hook = r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
          #endif
          '''
              new_content = re.sub(pattern, hook, content, count=1)
              
              # 在函数体开头插入调用（在第一个有效语句前）
              call_pattern = r'(long\s+do_faccessat\s*\([^)]*\)\s*\{[\s\S]*?)(if\s*\()'
              call_hook = r'''\1#ifdef CONFIG_KSU
          \tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          \t\2'''
              new_content = re.sub(call_pattern, call_hook, new_content, count=1)
              
              with open('fs/open.c', 'w') as f:
                  f.write(new_content)
              print("[+] fs/open.c: 已插入 ksu_handle_faccessat (指针版本, do_faccessat)")
          else:
              # 4.17 之前：修改 faccessat 系统调用
              pattern2 = r'(SYSCALL_DEFINE3\s*\(\s*faccessat\s*,\s*int\s*,\s*dfd\s*,[^)]*\)\s*\{)'
              if re.search(pattern2, content):
                  hook = r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
          #endif
          '''
                  new_content = re.sub(pattern2, hook, content, count=1)
                  call_pattern = r'(SYSCALL_DEFINE3\s*\(\s*faccessat\s*,\s*int\s*,\s*dfd\s*,[^)]*\)\s*\{[\s\S]*?)(if\s*\()'
                  call_hook = r'''\1#ifdef CONFIG_KSU
          \tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          \t\2'''
                  new_content = re.sub(call_pattern, call_hook, new_content, count=1)
                  with open('fs/open.c', 'w') as f:
                      f.write(new_content)
                  print("[+] fs/open.c: 已插入 ksu_handle_faccessat (指针版本, SYSCALL_DEFINE3 faccessat)")
              else:
                  print("::warning::fs/open.c: 未找到 faccessat/do_faccessat 插入点")
          PYEOF
            else
              echo "[+] fs/open.c: ksu_handle_faccessat 已存在，跳过"
            fi
          fi

          # ============================================================
          # 3. fs/read_write.c: vfs_read → ksu_handle_vfs_read
          # ============================================================
          if [ -f "fs/read_write.c" ]; then
            if ! grep -q "ksu_handle_vfs_read" fs/read_write.c; then
              python3 << 'PYEOF'
          import re

          with open('fs/read_write.c', 'r') as f:
              content = f.read()

          # 标准 KernelSU 在 vfs_read 中插入 hook（不是 ksys_read 或 SYSCALL_DEFINE3）
          pattern = r'(static\s+ssize_t\s+vfs_read\s*\([^)]*\)\s*\{)'
          if not re.search(pattern, content):
              # 尝试非 static 版本
              pattern = r'(ssize_t\s+vfs_read\s*\([^)]*\)\s*\{)'

          if re.search(pattern, content):
              hook = r'''\1
          #ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);
          #endif
          '''
              new_content = re.sub(pattern, hook, content, count=1)
              
              # 在函数体开头插入调用
              call_pattern = r'(ssize_t\s+\w+\s*\([^)]*\)\s*\{[\s\S]*?)(if\s*\(\s*unlikely)'
              call_hook = r'''\1#ifdef CONFIG_KSU
          \tif (unlikely(ksu_vfs_read_hook))
          \t\tksu_handle_vfs_read(&file, &buf, &count, &pos);
          #endif
          \t\2'''
              new_content = re.sub(call_pattern, call_hook, new_content, count=1)
              
              with open('fs/read_write.c', 'w') as f:
                  f.write(new_content)
              print("[+] fs/read_write.c: 已插入 ksu_handle_vfs_read (指针版本, vfs_read)")
          else:
              print("::warning::fs/read_write.c: 未找到 vfs_read 插入点")
          PYEOF
            else
              echo "[+] fs/read_write.c: ksu_handle_vfs_read 已存在，跳过"
            fi
          fi

          # ============================================================
          # 4. fs/stat.c: vfs_statx / vfs_fstatat → ksu_handle_stat
          # ============================================================
          if [ -f "fs/stat.c" ]; then
            if ! grep -q "ksu_handle_stat" fs/stat.c; then
              python3 << 'PYEOF'
          import re

          with open('fs/stat.c', 'r') as f:
              content = f.read()

          # 优先尝试 vfs_statx（4.11+）
          pattern = r'(int\s+vfs_statx\s*\([^)]*\)\s*\{)'
          if re.search(pattern, content):
              hook = r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          #endif
          '''
              new_content = re.sub(pattern, hook, content, count=1)
              
              call_pattern = r'(int\s+vfs_statx\s*\([^)]*\)\s*\{[\s\S]*?)(if\s*\()'
              call_hook = r'''\1#ifdef CONFIG_KSU
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif
          \t\2'''
              new_content = re.sub(call_pattern, call_hook, new_content, count=1)
              
              with open('fs/stat.c', 'w') as f:
                  f.write(new_content)
              print("[+] fs/stat.c: 已插入 ksu_handle_stat (指针版本, vfs_statx)")
          else:
              # 回退到 vfs_fstatat（4.11 之前）
              pattern = r'(int\s+vfs_fstatat\s*\([^)]*\)\s*\{)'
              if re.search(pattern, content):
                  hook = r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          #endif
          '''
                  new_content = re.sub(pattern, hook, content, count=1)
                  
                  call_pattern = r'(int\s+vfs_fstatat\s*\([^)]*\)\s*\{[\s\S]*?)(if\s*\()'
                  call_hook = r'''\1#ifdef CONFIG_KSU
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif
          \t\2'''
                  new_content = re.sub(call_pattern, call_hook, new_content, count=1)
                  
                  with open('fs/stat.c', 'w') as f:
                      f.write(new_content)
                  print("[+] fs/stat.c: 已插入 ksu_handle_stat (指针版本, vfs_fstatat)")
              else:
                  print("::warning::fs/stat.c: 未找到 vfs_statx/vfs_fstatat 插入点")
          PYEOF
            else
              echo "[+] fs/stat.c: ksu_handle_stat 已存在，跳过"
            fi
          fi

          # ============================================================
          # 5. drivers/input/input.c: input_handle_event → ksu_handle_input_handle_event
          # ============================================================
          if [ -f "drivers/input/input.c" ]; then
            if ! grep -q "ksu_handle_input_handle_event" drivers/input/input.c; then
              python3 << 'PYEOF'
          import re

          with open('drivers/input/input.c', 'r') as f:
              content = f.read()

          pattern = r'(static\s+void\s+input_handle_event\s*\([^)]*\)\s*\{)'
          if not re.search(pattern, content):
              pattern = r'(void\s+input_handle_event\s*\([^)]*\)\s*\{)'

          if re.search(pattern, content):
              hook = r'''\1
          #ifdef CONFIG_KSU
          extern bool ksu_input_hook __read_mostly;
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          #endif
          '''
              new_content = re.sub(pattern, hook, content, count=1)
              
              # 在函数体开头插入调用（在第一个变量声明或语句前）
              call_pattern = r'(input_handle_event\s*\([^)]*\)\s*\{[\s\S]*?)(int\s+disposition|if\s*\()'
              call_hook = r'''\1#ifdef CONFIG_KSU
          \tif (unlikely(ksu_input_hook))
          \t\tksu_handle_input_handle_event(&type, &code, &value);
          #endif
          \t\2'''
              new_content = re.sub(call_pattern, call_hook, new_content, count=1)
              
              with open('drivers/input/input.c', 'w') as f:
                  f.write(new_content)
              print("[+] drivers/input/input.c: 已插入 ksu_handle_input_handle_event (指针版本)")
          else:
              print("::warning::drivers/input/input.c: 未找到 input_handle_event 插入点")
          PYEOF
            else
              echo "[+] drivers/input/input.c: ksu_handle_input_handle_event 已存在，跳过"
            fi
          fi

          echo "[+] 标准 KernelSU 非 GKI Hook 应用完成"

      # ── 7. 集成 Droidspaces 支持 ──
      - name: 集成 Droidspaces 支持
        if: inputs.droidspaces_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail

          PATCH_SRC="${{ github.workspace }}/droidspaces-src"
          rm -rf "$PATCH_SRC"
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/seriaTvT/Droidspaces-OSS "$PATCH_SRC"
          git -C "$PATCH_SRC" sparse-checkout set \
            Documentation/resources/kernel-patches/non-GKI
          NON_GKI="$PATCH_SRC/Documentation/resources/kernel-patches/non-GKI"

          shopt -s nullglob
          for patch in "$NON_GKI"/*.patch; do
            name="$(basename "$patch")"
            mapfile -t targets < <(grep '^+++ ' "$patch" | sed -E 's#^\+\+\+ b/##; s/\t.*$//')

            if git apply --reverse --check "$patch" >/dev/null 2>&1; then
              echo "✅ 已应用，跳过: $name"
              continue
            fi

            if git apply --check "$patch" >/dev/null 2>&1; then
              git apply "$patch"
              echo "✅ 应用成功: $name"
              continue
            fi

            missing_all=true
            for t in "${targets[@]}"; do
              [ -e "$t" ] && missing_all=false
            done
            if [ "$missing_all" = true ]; then
              echo "⚠️ 目标文件不存在，跳过不适用补丁: $name (${targets[*]:-?})"
              continue
            fi

            echo "::error::补丁无法应用（疑似源码冲突）: $name"
            exit 1
          done

          DEFCONFIG="arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          if grep -q "Droidspaces support (non-GKI)" "$DEFCONFIG"; then
            echo "Droidspaces 内核配置已存在，跳过追加"
          else
            cat >> "$DEFCONFIG" << 'EOF'

          # ===== Droidspaces support (non-GKI) =====
          CONFIG_FHANDLE=y
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_HL=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_IP_NF_TARGET_ULOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_NETFILTER_NETLINK_LOG=y
          CONFIG_NETFILTER_XT_TARGET_NFLOG=y
          EOF
          fi

          echo "已写入 Droidspaces 内核配置:"
          cat "$DEFCONFIG"

      # ── 8. 版本伪装 ──
      - name: 伪装内核版本信息
        if: inputs.fake_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          IN_BUILD_USER: ${{ inputs.kbuild_build_user }}
          IN_BUILD_HOST: ${{ inputs.kbuild_build_host }}
          IN_BUILD_TIMESTAMP: ${{ inputs.kbuild_build_timestamp }}
          IN_BUILD_VERSION: ${{ inputs.kbuild_build_version }}
        run: |
          if [ -n "$IN_BUILD_USER" ]; then echo "KBUILD_BUILD_USER=$IN_BUILD_USER" >> "$GITHUB_ENV"; fi
          if [ -n "$IN_BUILD_HOST" ]; then echo "KBUILD_BUILD_HOST=$IN_BUILD_HOST" >> "$GITHUB_ENV"; fi
          if [ -n "$IN_BUILD_TIMESTAMP" ]; then echo "KBUILD_BUILD_TIMESTAMP=$IN_BUILD_TIMESTAMP" >> "$GITHUB_ENV"; fi
          if [ -n "$IN_BUILD_VERSION" ]; then echo "KBUILD_BUILD_VERSION=$IN_BUILD_VERSION" >> "$GITHUB_ENV"; fi

          if [ -n "${FAKE_EXTRAVERSION}" ]; then
            ESCAPED_EXTRA=$(printf '%s\n' "${FAKE_EXTRAVERSION}" | sed 's/[\&/\\]/\\&/g')
            sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = ${ESCAPED_EXTRA}/" Makefile
            sed -i '2i exit 0' scripts/setlocalversion
          fi

          if [ -n "${FAKE_COMPILER}" ]; then
            ESCAPED_COMPILER=$(printf '%s\n' "${FAKE_COMPILER}" | sed 's/[\&\|\\]/\\&/g')
            if ! grep -q '"$CC_VERSION, $LD_VERSION"' scripts/mkcompile_h; then
              echo "::error::未在 scripts/mkcompile_h 找到预期的 LINUX_COMPILER 拼接串，伪装编译器失败"
              exit 1
            fi
            sed -i "s|\"\\$CC_VERSION, \\$LD_VERSION\"|\"${ESCAPED_COMPILER}\"|" scripts/mkcompile_h
          fi

      # ── 9. 编译内核 ──
      - name: 生成 defconfig
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          if [[ "${{ inputs.ccache_enabled }}" == "true" ]]; then
            CC_CMD="ccache clang"
          else
            CC_CMD="clang"
          fi

          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC="${CC_CMD}" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            OBJSIZE=llvm-size \
            ${{ env.DEFCONFIG_NAME }}

          echo "[+] 强制启用 SUSFS 配置..."
          cd ${{ env.OUT_DIR }}
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SUS_MAP

          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC="${CC_CMD}" \
            oldconfig < /dev/null || true

          echo "=== 验证 SUSFS 配置 ==="
          grep "CONFIG_KSU_SUSFS" .config | head -20

      - name: 编译内核与设备树
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          if [[ "${{ inputs.ccache_enabled }}" == "true" ]]; then
            CC_CMD="ccache clang"
            ccache -z
          else
            CC_CMD="clang"
          fi

          if [[ "${{ inputs.fake_enabled }}" != "true" && -n "${{ inputs.kernel_suffix }}" ]]; then
            export LOCALVERSION="-${{ inputs.kernel_suffix }}"
          fi

          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC="${CC_CMD}" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            OBJSIZE=llvm-size \
            Image dtbs

      - name: 输出 ccache 统计
        if: inputs.ccache_enabled && always()
        run: ccache -s

      # ── 10. 保存 ccache ──
      - name: 保存 ccache 缓存
        if: inputs.ccache_enabled
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      # ── 11. 准备产物 ──
      - name: 校验内核与设备树镜像
        id: prepare_image
        run: |
          BOOT_DIR="${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot"
          BUILDDATE="${{ steps.setup_env.outputs.builddate }}"
          SUFFIX="${{ inputs.kernel_suffix }}"
          SUFFIX_STR="${SUFFIX:+-${SUFFIX}}"
          IMAGE_NAME="Image-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}${SUFFIX_STR}-${BUILDDATE}"
          DTB_NAME="dtb-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}${SUFFIX_STR}-${BUILDDATE}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "dtb_name=${DTB_NAME}" >> $GITHUB_OUTPUT

          if [[ ! -f "${BOOT_DIR}/Image" ]]; then
            echo "::error::未找到内核镜像文件 (Image)，构建失败"
            exit 1
          fi
          echo "内核镜像校验通过: ${BOOT_DIR}/Image"

          find "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dts/" -name "*.dtb" -type f -exec cat {} + > "${BOOT_DIR}/dtb"

          if [[ ! -s "${BOOT_DIR}/dtb" ]]; then
            echo "::error::未找到编译出的 DTB 文件，构建失败"
            exit 1
          fi
          echo "DTB 文件校验及合并通过: ${BOOT_DIR}/dtb"

      - name: 打包 AnyKernel3
        if: inputs.use_anykernel
        id: pack_anykernel
        run: |
          BOOT_DIR="${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot"
          BUILDDATE="${{ steps.setup_env.outputs.builddate }}"
          SUFFIX="${{ inputs.kernel_suffix }}"
          SUFFIX_STR="${SUFFIX:+-${SUFFIX}}"
          AK3_NAME="${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}${SUFFIX_STR}_${BUILDDATE}"

          if [ -f "${BOOT_DIR}/Image" ]; then
            cp -f "${BOOT_DIR}/Image" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/Image.gz" ]; then
            cp -f "${BOOT_DIR}/Image.gz" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/dtb" ]; then
            cp -f "${BOOT_DIR}/dtb" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/dtbo" ]; then
            cp -f "${BOOT_DIR}/dtbo" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/dtbo.img" ]; then
            cp -f "${BOOT_DIR}/dtbo.img" ./AnyKernel3/
          fi

          cd AnyKernel3/
          zip -q -r "${{ github.workspace }}/${AK3_NAME}.zip" *
          echo "ak3name=${AK3_NAME}.zip" >> $GITHUB_OUTPUT

      # ── 12. 上传产物 ──
      - name: 上传 AnyKernel3 刷入包
        if: inputs.use_anykernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack_anykernel.outputs.ak3name }}
          path: ${{ github.workspace }}/${{ steps.pack_anykernel.outputs.ak3name }}
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_image.outputs.image_name }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: 上传 dtb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_image.outputs.dtb_name }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # 发布 Release
  # ============================================================
  release:
    name: 发布 Release
    if: inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./release_files

      - name: 设置发布环境变量
        run: |
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_HEAD="chopin-build"

          if [[ -n "${{ inputs.kernel_suffix }}" ]]; then
            FULL_VERSION="${{ env.KERNEL_NAME }}-${{ inputs.kernel_suffix }}"
          else
            FULL_VERSION="${{ env.KERNEL_NAME }}"
          fi

          if [[ "${{ inputs.ksu_enabled }}" == "true" ]]; then
            KSU_STATUS="SukiSU-Ultra (Manual Hook)"
          else
            KSU_STATUS="未集成"
          fi

          if [[ "${{ inputs.susfs_enabled }}" == "true" && "${{ inputs.ksu_enabled }}" == "true" ]]; then
            SUSFS_STATUS="已集成 (v1.4.2-kernel-4.14)"
          else
            SUSFS_STATUS="未集成"
          fi

          if [[ "${{ inputs.droidspaces_enabled }}" == "true" ]]; then
            DS_STATUS="已集成 (官方补丁 + 内核配置)"
          else
            DS_STATUS="未集成"
          fi

          if [[ "${{ inputs.fake_enabled }}" == "true" ]]; then
            FAKE_INFO="${{ inputs.kbuild_build_user }}@${{ inputs.kbuild_build_host }}"
            FAKE_TIME="${{ inputs.kbuild_build_timestamp }}"
            FAKE_VER="${{ inputs.kbuild_build_version }}"
          else
            FAKE_INFO="未伪装（真实环境）"
            FAKE_TIME="未伪装（真实环境）"
            FAKE_VER="未伪装（真实环境）"
          fi

          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "KSU_STATUS=$KSU_STATUS" >> $GITHUB_ENV
          echo "SUSFS_STATUS=$SUSFS_STATUS" >> $GITHUB_ENV
          echo "DS_STATUS=$DS_STATUS" >> $GITHUB_ENV
          echo "FAKE_INFO=$FAKE_INFO" >> $GITHUB_ENV
          echo "FAKE_TIME=$FAKE_TIME" >> $GITHUB_ENV
          echo "FAKE_VER=$FAKE_VER" >> $GITHUB_ENV

      - name: 创建 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 构建信息
          - 设备: chopin (Redmi Note 10 Pro / POCO X3 GT)
          - 内核分支: ${{ env.KERNEL_BRANCH }}
          - 内核版本: ${{ env.FULL_VERSION }}
          - 编译时间: ${{ env.TIME_FORM }}
          - KernelSU: ${{ env.KSU_STATUS }}
          - SUSFS: ${{ env.SUSFS_STATUS }}
          - Droidspaces: ${{ env.DS_STATUS }}
          - AnyKernel3 打包: ${{ inputs.use_anykernel }}
          - CCache 加速: ${{ inputs.ccache_enabled }}
          - 伪装启用: ${{ inputs.fake_enabled }}
          - 伪装信息: ${{ env.FAKE_INFO }}
          - 伪装时间: ${{ env.FAKE_TIME }}
          - 伪装版本: ${{ env.FAKE_VER }}
          EOF

          shopt -s nullglob
          RELEASE_FILES=()

          for f in ./release_files/*/*.zip; do
            RELEASE_FILES+=("$f")
          done
          for f in ./release_files/*/Image; do
            RELEASE_FILES+=("$f")
          done
          for f in ./release_files/*/dtb; do
            RELEASE_FILES+=("$f")
          done

          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "::error::未找到任何可发布的文件"
            exit 1
          fi

          echo "即将发布以下文件:"
          printf ' - %s\n' "${RELEASE_FILES[@]}"

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.FULL_VERSION }}-${{ env.TIME }}" \
            --notes-file release_notes.md \
            "${RELEASE_FILES[@]}"

name: Chopin 4.14 内核构建

env:
  TZ: Asia/Shanghai

  # ── 内核源码 ──
  KERNEL_NAME: Chopin-A16-KVM-Proton-release
  KERNEL_REPO: https://github.com/wildhunte777/kernel_mt6893
  KERNEL_BRANCH: chopin_kvm
  KERNEL_DEVICE: chopin
  DEFCONFIG_NAME: chopin_defconfig

  # ── 工具链 ──
  # 实际工具链（AOSP Clang 12.0.5 r416183b，纯 LLVM 构建）

  # ── AnyKernel3 ──
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  ANYKERNEL_BRANCH: master

  # ── 构建参数 ──
  ARCH: arm64
  OUT_DIR: "${{ github.workspace }}/out"

  # ── KBUILD 伪装配置 ──
  FAKE_EXTRAVERSION: ${{ inputs.fake_extraversion }}
  FAKE_COMPILER: ${{ inputs.fake_compiler }}

  # ── ccache ──
  CCACHE_KEY: ccache-chopin-4.14-a16

on:
  workflow_dispatch:
    inputs:
      ksu_enabled:
        description: '是否集成 ReSukiSU (Manual Hook)'
        required: true
        type: boolean
        default: true

      susfs_enabled:
        description: '是否集成 SUSFS (隐藏模块/路径/挂载，需 ReSukiSU)'
        required: true
        type: boolean
        default: true

      droidspaces_enabled:
        description: '是否集成 Droidspaces 支持（应用官方补丁并写入所需内核配置）'
        required: true
        type: boolean
        default: true

      use_anykernel:
        description: '是否使用 AnyKernel3 打包刷入包（关闭时仅上传 Image）'
        required: true
        type: boolean
        default: true

      fake_enabled:
        description: '是否进行编译伪装（总开关；开启后各伪装项留空即保留真实值）'
        required: true
        type: boolean
        default: false
        
      ccache_enabled:
        description: '是否启用 ccache 加速编译'
        required: true
        type: boolean
        default: true

      ccache_update:
        description: '更新 ccache 缓存（更改编译配置或需要刷新缓存时开启）'
        required: true
        type: boolean
        default: false

      release:
        description: '是否发布到 GitHub Releases'
        required: true
        type: boolean
        default: true

      kernel_suffix:
        description: '自定义内核后缀（留空使用默认，开头勿加连字符）'
        required: false
        type: string
        default: ''

      kbuild_build_user:
        description: '伪装编译用户名 (KBUILD_BUILD_USER)，留空则保留真实值, builder'
        required: false
        type: string
        default: ''

      kbuild_build_host:
        description: '伪装编译主机名 (KBUILD_BUILD_HOST)，留空则保留真实值, android-builder'
        required: false
        type: string
        default: ''

      kbuild_build_timestamp:
        description: '伪装编译时间 (KBUILD_BUILD_TIMESTAMP)，留空则保留真实值, Fri Mar 28 13:14:00 CST 2025'
        required: false
        type: string
        default: ''

      kbuild_build_version:
        description: '伪装编译版本 (KBUILD_BUILD_VERSION)，留空则保留真实值'
        required: false
        type: string
        default: '1'

      fake_extraversion:
        description: '伪装内核版本号后缀 (FAKE_EXTRAVERSION)，留空则保留真实值, -g88e8616a5866'
        required: false
        type: string
        default: ''

      fake_compiler:
        description: '伪装编译器信息 (FAKE_COMPILER)，留空则保留真实值'
        required: false
        type: string
        default: ''

jobs:
  # ============================================================
  #  构建内核
  # ============================================================
  build:
    name: 构建内核
    runs-on: ubuntu-22.04
    steps:

      # ── 1. 初始化构建环境 ──
      - name: 初始化构建环境
        id: setup_env
        run: |
          echo "builddate=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

          sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libfl-dev curl git ccache python2 python2-dev zip unzip

      # ── 2. 克隆内核源码 ──
      - name: 克隆内核源码
        run: |
          git clone --recursive --depth=1 -j $(nproc) \
            --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} \
            ${{ env.KERNEL_NAME }}

      # ── 3. 获取工具链 (AOSP Clang 12) ──
      - name: 获取工具链
        run: |
          mkdir -p aosp-clang
          CLANG_URL="https://github.com/seriaTvT/kernel-builder-chopin/releases/download/Toolchain/linux-x86-bd96dfe349c962681f0e5388af874c771ef96670-clang-r416183b.tar.gz"
          for i in 1 2 3; do
            wget -qO clang.tar.gz "$CLANG_URL" && break || { echo "下载失败，重试 $i/3..."; sleep 15; }
          done
          tar -xf clang.tar.gz -C aosp-clang
          echo "${{ github.workspace }}/aosp-clang/bin" >> $GITHUB_PATH

      # ── 4. 准备 AnyKernel3 ──
      - name: 准备 AnyKernel3
        if: inputs.use_anykernel
        run: |
          git clone --recursive --depth=1 -j $(nproc) \
            --branch ${{ env.ANYKERNEL_BRANCH }} \
            ${{ env.ANYKERNEL_REPO }} \
            AnyKernel3

          rm -f AnyKernel3/anykernel.sh
          cat << 'EOF' > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=Chopin Custom Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }
          
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          
          . tools/ak3-core.sh;
          
          split_boot;
          flash_boot;
          EOF

      # ── 5. 配置并恢复 ccache ──
      - name: 配置 ccache
        if: inputs.ccache_enabled
        run: |
          ccache -o compression=true -o cache_dir=$HOME/.ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 载入 ccache 缓存
        if: inputs.ccache_enabled && !inputs.ccache_update
        uses: actions/cache/restore@v4
        id: ccache_restore
        with:
          path: ~/.ccache
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_KEY }}-

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_enabled && inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          PREFIX="${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-"
          mapfile -t KEYS < <(gh cache list -R ${{ github.repository }} \
            --key "$PREFIX" --limit 100 --json key --jq '.[].key')
          if [ ${#KEYS[@]} -eq 0 ]; then
            echo "未找到匹配前缀的旧缓存（前缀: $PREFIX）。"
          else
            for k in "${KEYS[@]}"; do
              if gh cache delete "$k" -R ${{ github.repository }}; then
                echo "成功删除旧缓存: $k"
              else
                echo "删除失败或已被清理: $k"
              fi
            done
          fi

      # ── 6. 集成 ReSukiSU ──
      - name: 集成 ReSukiSU
        if: inputs.ksu_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          if [ -d "./KernelSU" ]; then
            rm -rf "./KernelSU"
          fi
          if [ -d "./drivers/kernelsu" ]; then
            rm -rf "./drivers/kernelsu"
          fi

          curl -LSs "https://raw.githubusercontent.com/wildhunte777/ReSukiSU/main/kernel/setup.sh" | bash -s main

          echo -e "CONFIG_KSU=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          
                   # MANUAL_HOOK 负责 LSM hook 注册，SUSFS 负责隐藏功能，两者独立共存
          echo -e "CONFIG_KSU_MANUAL_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          
          # =================================================================================
          
          echo -e "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KALLSYMS=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KALLSYMS_ALL=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KALLSYMS_ABSOLUTE_PERCPU=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          cat arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          
        # ── 6.1 Patch ReSukiSU dispatch.c 包含 compat header ──
      - name: Patch ReSukiSU dispatch.c
        if: inputs.ksu_enabled && inputs.susfs_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          DISPATCH="drivers/kernelsu/supercall/dispatch.c"
          
          # 1) 添加 compat header（匹配 susfs.h 或 susfs_def.h）
          if [ -f "$DISPATCH" ] && ! grep -q "susfs_ksu_compat.h" "$DISPATCH"; then
            if grep -q '#include <linux/susfs.h>' "$DISPATCH"; then
              sed -i '/#include <linux\/susfs.h>/a #include <linux/susfs_ksu_compat.h>' "$DISPATCH"
            else
              sed -i '/#include <linux\/susfs_def.h>/a #include <linux/susfs_ksu_compat.h>' "$DISPATCH"
            fi
            echo "[+] 已添加 susfs_ksu_compat.h 到 dispatch.c"
          fi
          
          # 2) 修复 ksu_handle_susfs_cmd：susfs_xxx(arg) → susfs_xxx(*arg)
          python3 << 'PYEOF'
          import re

          with open('drivers/kernelsu/supercall/dispatch.c', 'r') as f:
              content = f.read()

          pattern = r'(int ksu_handle_susfs_cmd\(unsigned int cmd, void __user \*\*arg\)\s*\{)(.*?)(\n\}\s*\n#endif)'

          def fix_body(m):
              header, body, footer = m.group(1), m.group(2), m.group(3)
              
              body = re.sub(
                  r'\b(susfs_add_sus_path|susfs_add_sus_path_loop|susfs_set_hide_sus_mnts_for_non_su_procs|susfs_add_sus_kstat|susfs_update_sus_kstat|susfs_set_uname|susfs_set_cmdline_or_bootconfig|susfs_add_open_redirect|susfs_add_sus_map|susfs_set_avc_log_spoofing|susfs_get_enabled_features|susfs_show_variant|susfs_show_version)\(arg\);',
                  r'\1(*arg);',
                  body
              )
              
              body = body.replace('susfs_enable_log(arg);', 'susfs_enable_log(*arg);')
              
              return header + body + footer

          new_content = re.sub(pattern, fix_body, content, flags=re.DOTALL)
          
          if new_content == content:
              print("::warning::dispatch.c 正则未匹配到 ksu_handle_susfs_cmd")
          else:
              with open('drivers/kernelsu/supercall/dispatch.c', 'w') as f:
                  f.write(new_content)
              print("[+] dispatch.c 已修复：arg -> *arg")
          PYEOF
          
          SUCOMPAT="drivers/kernelsu/feature/sucompat.c"
          if [ -f "$SUCOMPAT" ] && ! grep -q "susfs_ksu_compat.h" "$SUCOMPAT"; then
            sed -i '/#include <linux\/susfs.h>/a #include <linux/susfs_ksu_compat.h>' "$SUCOMPAT"
            echo "[+] 已添加 susfs_ksu_compat.h 到 sucompat.c"
          fi
          
          UMOUNT="drivers/kernelsu/feature/kernel_umount.c"
          if [ -f "$UMOUNT" ] && ! grep -q "susfs_ksu_compat.h" "$UMOUNT"; then
            sed -i '/#include <linux\/susfs.h>/a #include <linux/susfs_ksu_compat.h>' "$UMOUNT"
            echo "[+] 已添加 susfs_ksu_compat.h 到 kernel_umount.c"
          fi
            
       # ── 6.5 集成 SUSFS (kernel-4.14 分支最新 = v1.5.5) ──
      - name: 集成 SUSFS (4.14 最新分支)
        if: inputs.susfs_enabled && inputs.ksu_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail

          SUSFS_SRC="${{ github.workspace }}/susfs4ksu"
          PATCH_FILE="$SUSFS_SRC/kernel_patches/50_add_susfs_in_kernel-4.14.patch"

          echo "[+] 下载 SUSFS kernel-4.14 分支最新 (预期 v1.5.5) ..."
          rm -rf "$SUSFS_SRC"
          git clone --depth=1 --branch "kernel-4.14" \
            https://gitlab.com/simonpunk/susfs4ksu.git "$SUSFS_SRC"

          # 验证实际版本
          echo "[+] 验证 SUSFS 版本 ..."
          grep -r "SUSFS_VERSION" "$SUSFS_SRC/kernel_patches/include/linux/susfs.h" 2>/dev/null || true
          head -20 "$SUSFS_SRC/kernel_patches/fs/susfs.c" | grep -i "version\|susfs" || true

          # 1) 复制核心文件
          echo "[+] 复制 SUSFS 核心文件 ..."
          cp -v "$SUSFS_SRC/kernel_patches/fs/susfs.c" fs/
          cp -v "$SUSFS_SRC/kernel_patches/include/linux/susfs.h" include/linux/
          if [ -f "$SUSFS_SRC/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -v "$SUSFS_SRC/kernel_patches/include/linux/susfs_def.h" include/linux/
          fi

          # 1.5) 创建完整的 ReSukiSU v2.2.0 → SUSFS v1.5.5 转接层
          echo "[+] 创建 susfs_ksu_compat.h 兼容层 ..."

          cat > include/linux/susfs_ksu_compat.h << 'EOF'
          #ifndef KSU_SUSFS_COMPAT_H
          #define KSU_SUSFS_COMPAT_H
          /*
           * Complete bridge header: ReSukiSU (SUSFS v2.2.0 API)
           * → kernel-4.14 SUSFS v1.5.5
           */
          #include <linux/uaccess.h>
          #include <linux/workqueue.h>

          /* ===== v2.2.0 Magic & CMD defines missing in v1.5.5 ===== */
          #define SUSFS_MAGIC                                0x9B0E63
          #define CMD_SUSFS_ADD_SUS_PATH_LOOP                0x55551
          #define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS   0x55561
          #define CMD_SUSFS_ADD_SUS_MAP                      0x55562
          #define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING          0x55563

          /* ===== v1.5.5 已有的 CMD（确保一致性）===== */
          #ifndef CMD_SUSFS_ADD_SUS_PATH
          #define CMD_SUSFS_ADD_SUS_PATH                     0x55550
          #endif
          #ifndef CMD_SUSFS_ADD_SUS_MOUNT
          #define CMD_SUSFS_ADD_SUS_MOUNT                    0x55560
          #endif
          #ifndef CMD_SUSFS_ADD_SUS_KSTAT
          #define CMD_SUSFS_ADD_SUS_KSTAT                    0x55570
          #endif
          #ifndef CMD_SUSFS_UPDATE_SUS_KSTAT
          #define CMD_SUSFS_UPDATE_SUS_KSTAT                 0x55571
          #endif
          #ifndef CMD_SUSFS_ADD_TRY_UMOUNT
          #define CMD_SUSFS_ADD_TRY_UMOUNT                   0x55580
          #endif
          #ifndef CMD_SUSFS_SET_UNAME
          #define CMD_SUSFS_SET_UNAME                        0x55590
          #endif
          #ifndef CMD_SUSFS_ENABLE_LOG
          #define CMD_SUSFS_ENABLE_LOG                       0x555a0
          #endif
          #ifndef CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG
          #define CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG        0x555b0
          #endif
          #ifndef CMD_SUSFS_ADD_OPEN_REDIRECT
          #define CMD_SUSFS_ADD_OPEN_REDIRECT                0x555c0
          #endif
          #ifndef CMD_SUSFS_SHOW_VERSION
          #define CMD_SUSFS_SHOW_VERSION                     0x555e1
          #endif
          #ifndef CMD_SUSFS_SHOW_ENABLED_FEATURES
          #define CMD_SUSFS_SHOW_ENABLED_FEATURES            0x555e2
          #endif
          #ifndef CMD_SUSFS_SHOW_VARIANT
          #define CMD_SUSFS_SHOW_VARIANT                     0x555e3
          #endif

          /* ===== 前向声明（避免循环 include）===== */
          void susfs_set_log(bool enabled);

          /* ===== v2.2.0 新增全局符号 ===== */
          extern struct work_struct susfs_extra_works;

          /* ===== v2.2.0 新函数 → v1.5.5 stub ===== */
          static inline int susfs_add_sus_path_loop(void __user *p)
          { (void)p; return -ENOTSUPP; }

          static inline int susfs_set_hide_sus_mnts_for_non_su_procs(void __user *p)
          { (void)p; return -ENOTSUPP; }

          static inline int susfs_add_sus_map(void __user *p)
          { (void)p; return -ENOTSUPP; }

          static inline int susfs_set_avc_log_spoofing(void __user *p)
          { (void)p; return -ENOTSUPP; }

          static inline int susfs_get_enabled_features(void __user *p)
          { (void)p; return -ENOTSUPP; }

          static inline int susfs_show_variant(void __user *p)
          { (void)p; return -ENOTSUPP; }

          static inline int susfs_show_version(void __user *p)
          { (void)p; return -ENOTSUPP; }

          static inline void susfs_start_sdcard_monitor_fn(void) {}

          /* ===== 内核补丁插入的函数（task_mmu.c 等）===== */
          static inline int susfs_sus_map(void *m, void *vma, int is_pid)
          { (void)m; (void)vma; (void)is_pid; return 0; }

          /* ===== KernelSU Next optional hooks (ReSukiSU 未实现) ===== */
          static inline void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr){(void)fd;(void)statbuf_ptr;}
          static inline void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr){(void)fd;(void)statbuf_ptr;}
          /* ===== 函数名映射：v2.2.0 → v1.5.5 ===== */
          static inline int susfs_enable_log(void __user *user_info)
          {
          #ifdef CONFIG_KSU_SUSFS_ENABLE_LOG
              bool enabled;
              if (copy_from_user(&enabled, user_info, sizeof(enabled)))
                  return -EFAULT;
              susfs_set_log(enabled);
          #endif
              return 0;
          }

          /* ===== ReSukiSU 特定 stub ===== */
          static inline bool susfs_is_current_proc_umounted(void)
          { return false; }

          static inline void susfs_set_current_proc_umounted(void) {}

          #endif /* KSU_SUSFS_COMPAT_H */
          EOF

          sed -i 's/^[[:space:]]*//' include/linux/susfs_ksu_compat.h

          echo "[+] 兼容层创建完成"
                    echo "[+] 链接 susfs_ksu_compat.h 到 susfs_def.h ..."
          python3 << 'PYEOF'
          with open('include/linux/susfs_def.h', 'r') as f:
              content = f.read()

          if 'susfs_ksu_compat.h' not in content:
              content = content.replace(
                  '#endif // #ifndef KSU_SUSFS_DEF_H',
                  '#include <linux/susfs_ksu_compat.h>\n#endif // #ifndef KSU_SUSFS_DEF_H'
              )
              with open('include/linux/susfs_def.h', 'w') as f:
                  f.write(content)
              print('[+] susfs_def.h 已链接 compat header')
          else:
              print('[+] susfs_def.h 已包含 compat header')
          PYEOF
                             # 1.6) 只保留 work_struct 定义（compat header 已提供所有 stub）
          echo "[+] 追加 work_struct 到 fs/susfs.c ..."
          cat >> fs/susfs.c << 'EOF'

          /* ===== ReSukiSU compat: work_struct ===== */
          struct work_struct susfs_extra_works;
          EOF

          # 2) 应用内核侧补丁
          echo "[+] 应用内核侧补丁 (50_add_susfs_in_kernel-4.14.patch) ..."
          REJ_DIR="${{ github.workspace }}/susfs_rejects"
          mkdir -p "$REJ_DIR"
          
          if git apply --check "$PATCH_FILE" >/dev/null 2>&1; then
            git apply "$PATCH_FILE"
            echo "[+] 内核补丁干净应用成功"
          else
            echo "::warning::内核补丁无法干净应用，强制应用并收集冲突 ..."
            git apply --reject "$PATCH_FILE" || true
            
            find . -name "*.rej" -type f | while read -r rej; do
              echo "  发现 reject 文件: $rej"
              cp -v "$rej" "$REJ_DIR/"
            done
          fi
          
          # 清理 .rej/.orig
          find . -name "*.rej" -type f -delete
          find . -name "*.orig" -type f -delete
          
          # 3) 检查关键文件是否有冲突
          if [ -f "fs/proc/task_mmu.c.rej" ] || [ -f "kernel/sys.c.rej" ]; then
            echo "::warning::关键文件补丁冲突，但继续构建（请确认已手动修复）"
          fi
          
          if [ "$(ls -A "$REJ_DIR")" ]; then
            echo "::warning::发现非关键补丁冲突，.rej 文件已收集"
          fi

          # 4) 应用 KernelSU 侧补丁（仅标准 KernelSU 需要，ReSukiSU 已内置）
          echo "[+] 检查是否需要 KernelSU 侧补丁 ..."
          if [ -f "kernel/core_hook.c" ] && [ -f "kernel/ksu.c" ]; then
            echo "[+] 检测到标准 KernelSU，应用 SUSFS KernelSU 侧补丁 ..."
            KSU_PATCH="$SUSFS_SRC/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            if git apply --check "$KSU_PATCH" >/dev/null 2>&1; then
              git apply "$KSU_PATCH"
              echo "[+] KernelSU 补丁应用成功"
            else
              echo "::warning::KernelSU 补丁无法应用，跳过"
            fi
          else
            echo "[+] 检测到 ReSukiSU（已内置 SUSFS 支持），跳过 KernelSU 侧补丁"
          fi

          # 5) 修改 fs/Makefile 添加 susfs.o
          echo "[+] 修改 fs/Makefile ..."
          if ! grep -q "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
            echo "[+] 已追加 susfs.o 到 fs/Makefile"
          else
            echo "[+] fs/Makefile 已包含 susfs.o，跳过"
          fi

                  # 5.1) 导出 susfs_try_umount（SUSFS 中为 static，需改为全局供 ReSukiSU 调用）
          echo "[+] 导出 susfs_try_umount ..."
          if grep -q "^static void susfs_try_umount(uid_t uid)" fs/susfs.c; then
              sed -i 's/^static void susfs_try_umount(uid_t uid)/void susfs_try_umount(uid_t uid)/' fs/susfs.c
              echo "[+] fs/susfs.c: static → global"
          else
              echo "[+] fs/susfs.c: susfs_try_umount 已是 global 或不存在"
          fi
          
          if ! grep -q "extern void susfs_try_umount(uid_t uid)" include/linux/susfs.h; then
              echo "extern void susfs_try_umount(uid_t uid);" >> include/linux/susfs.h
              echo "[+] include/linux/susfs.h: 添加 extern 声明"
          else
              echo "[+] include/linux/susfs.h: extern 声明已存在"
          fi
          
          # 6) 追加 SUSFS 内核配置
          echo "[+] 写入 SUSFS 内核配置 ..."
          DEFCONFIG="arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          if grep -q "CONFIG_KSU_SUSFS=y" "$DEFCONFIG" 2>/dev/null; then
              echo "[+] SUSFS 配置已存在，跳过"
          else
              {
              echo ""
              echo "# ===== SUSFS support (4.14 non-GKI) ====="
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
              } >> "$DEFCONFIG"
              echo "[+] SUSFS 配置写入完成"
          fi
            # ── 6.6 调试：打印关键文件内容后退出 ──
      - name: 调试打印关键文件并退出
        if: inputs.ksu_enabled && inputs.susfs_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          echo "========== dispatch.c 前 30 行 =========="
          head -30 drivers/kernelsu/supercall/dispatch.c
          
          echo ""
          echo "========== susfs_ksu_compat.h 完整内容 =========="
          cat include/linux/susfs_ksu_compat.h
          
          echo ""
          echo "========== susfs_def.h 最后 10 行 =========="
          tail -10 include/linux/susfs_def.h
          
          echo ""
          echo "[+] 调试信息打印完成，退出构建"
          exit 0
      # ── 6.8 清理 Manual Hook 残留并补全 Required Hooks ──
      - name: 清理 Manual Hook 并补全 Required Hooks
        if: inputs.ksu_enabled && inputs.susfs_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          echo "[+] 处理内核源码中的 hook 兼容性问题 ..."

          # 把 Python 脚本写入临时文件，避免 YAML heredoc 地狱
          cat > /tmp/fix_hooks.py << 'PYEOF'
          import re
          import os

          INCOMPATIBLE_DECLS = [
              r'extern\s+bool\s+ksu_input_hook\s+__read_mostly;',
              r'extern\s+bool\s+ksu_execveat_hook\s+__read_mostly;',
              r'extern\s+bool\s+ksu_init_rc_hook\s+__read_mostly;',
              r'extern\s+bool\s+ksu_vfs_read_hook\s+__read_mostly;',
          ]

          INCOMPATIBLE_CALLS = [
              r'if\s*\(\s*unlikely\s*\(\s*ksu_input_hook\s*\)\s*\)\s*\n\s*ksu_handle_input_handle_event\([^)]*\);',
              r'if\s*\(\s*unlikely\s*\(\s*ksu_execveat_hook\s*\)\s*\)\s*\n\s*ksu_handle_execveat\([^)]*\);',
              r'if\s*\(\s*unlikely\s*\(\s*ksu_init_rc_hook\s*\)\s*\)\s*\n\s*ksu_handle_initrc\([^)]*\);',
              r'if\s*\(\s*unlikely\s*\(\s*ksu_vfs_read_hook\s*\)\s*\)\s*\n\s*ksu_handle_vfs_read\([^)]*\);',
          ]

          def clean_incompatible(content):
              for decl in INCOMPATIBLE_DECLS:
                  content = re.sub(r'\s*' + decl + r'\s*\n', '\n', content)
              for call in INCOMPATIBLE_CALLS:
                  content = re.sub(r'\s*' + call + r'\s*\n?', '\n', content)
              return content

          def fix_guards(content):
              return content.replace('CONFIG_KSU_MANUAL_HOOK', 'CONFIG_KSU')

          def patch_if_missing(filepath, required, pattern, hook_block):
              if not os.path.exists(filepath):
                  return
              with open(filepath, 'r') as f:
                  content = f.read()
              if required in content:
                  content = clean_incompatible(content)
                  content = fix_guards(content)
                  with open(filepath, 'w') as f:
                      f.write(content)
                  print(f'  {filepath}: {required} 已存在，已清理 incompatible')
                  return
              if re.search(pattern, content):
                  content = re.sub(pattern, hook_block, content, count=1)
                  content = clean_incompatible(content)
                  content = fix_guards(content)
                  with open(filepath, 'w') as f:
                      f.write(content)
                  print(f'  {filepath}: {required} 已插入')
              else:
                  print(f'::warning::无法在 {filepath} 中找到插入点')

          # fs/exec.c: ksu_handle_execveat
          patch_if_missing('fs/exec.c', 'ksu_handle_execveat',
              r'(static\s+int\s+do_execveat_common\s*\([^)]*\)\s*\{)',
              r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_execveat(int fd, struct filename *filename, void *argv, void *envp, int flags);
          if (ksu_handle_execveat(fd, filename, argv, envp, flags))
              return 0;
          #endif
          ''')

          # fs/open.c: ksu_handle_faccessat
          patch_if_missing('fs/open.c', 'ksu_handle_faccessat',
              r'(long\s+do_faccessat\s*\([^)]*\)\s*\{)',
              r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int dfd, const char __user *filename, int mode);
          if (ksu_handle_faccessat(dfd, filename, mode))
              return 0;
          #endif
          ''')

          # fs/stat.c: ksu_handle_stat
          patch_if_missing('fs/stat.c', 'ksu_handle_stat',
              r'(int\s+vfs_statx\s*\([^)]*\)\s*\{)',
              r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_stat(int dfd, const char __user *filename, int flags);
          if (ksu_handle_stat(dfd, filename, flags))
              return 0;
          #endif
          ''')

          # fs/read_write.c: ksu_handle_sys_read (在 SYSCALL_DEFINE3(read) 或 ksys_read 中)
          if os.path.exists('fs/read_write.c'):
              with open('fs/read_write.c', 'r') as f:
                  content = f.read()
              if 'ksu_handle_sys_read' not in content:
                  # 尝试 SYSCALL_DEFINE3(read, ...)
                  m = re.search(r'(SYSCALL_DEFINE3\s*\(\s*read\s*,\s*unsigned\s+int\s*,\s*fd\s*,[^)]*\)\s*\{)', content)
                  if m:
                      hook = r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);
          if (ksu_handle_sys_read(fd, &buf, &count)) {
              return -EFAULT;
          }
          #endif
          '''
                      content = re.sub(r'(SYSCALL_DEFINE3\s*\(\s*read\s*,\s*unsigned\s+int\s*,\s*fd\s*,[^)]*\)\s*\{)', hook, content, count=1)
                      print('  fs/read_write.c: ksu_handle_sys_read 已插入 (SYSCALL_DEFINE3)')
                  else:
                      # 尝试 ksys_read
                      m2 = re.search(r'(ssize_t\s+ksys_read\s*\(\s*unsigned\s+int\s+fd[^)]*\)\s*\{)', content)
                      if m2:
                          hook = r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);
          if (ksu_handle_sys_read(fd, &buf, &count)) {
              return -EFAULT;
          }
          #endif
          '''
                          content = re.sub(r'(ssize_t\s+ksys_read\s*\(\s*unsigned\s+int\s+fd[^)]*\)\s*\{)', hook, content, count=1)
                          print('  fs/read_write.c: ksu_handle_sys_read 已插入 (ksys_read)')
                      else:
                          print('::warning::无法在 fs/read_write.c 中找到 read/ksys_read')
              content = clean_incompatible(content)
              content = fix_guards(content)
              with open('fs/read_write.c', 'w') as f:
                  f.write(content)

          # kernel/reboot.c: ksu_handle_sys_reboot
          patch_if_missing('kernel/reboot.c', 'ksu_handle_sys_reboot',
              r'(SYSCALL_DEFINE4\s*\(\s*reboot\s*,\s*int\s*,\s*magic1\s*,[^)]*\)\s*\{)',
              r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user *arg);
          if (ksu_handle_sys_reboot(magic1, magic2, cmd, arg))
              return 0;
          #endif
          ''')

          # drivers/input/input.c: ksu_handle_input_handle_event
          patch_if_missing('drivers/input/input.c', 'ksu_handle_input_handle_event',
              r'(void\s+input_event\s*\([^)]*\)\s*\{)',
              r'''\1
          #ifdef CONFIG_KSU
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          if (ksu_handle_input_handle_event(&type, &code, &value))
              return;
          #endif
          ''')

          # kernel/sys.c: 只清理 guard 和 incompatible（setresuid 由 6.9 处理）
          if os.path.exists('kernel/sys.c'):
              with open('kernel/sys.c', 'r') as f:
                  content = f.read()
              content = clean_incompatible(content)
              content = fix_guards(content)
              with open('kernel/sys.c', 'w') as f:
                  f.write(content)
              print('  kernel/sys.c: 已清理')

          # fs/stat.c: 补全 ksu_handle_newfstat_ret / ksu_handle_fstat64_ret 声明
          if os.path.exists('fs/stat.c'):
              with open('fs/stat.c', 'r') as f:
                  content = f.read()
              decls = []
              if 'ksu_handle_newfstat_ret' in content and 'extern int ksu_handle_newfstat_ret' not in content:
                  decls.append('extern int ksu_handle_newfstat_ret(struct kstat *stat);')
              if 'ksu_handle_fstat64_ret' in content and 'extern int ksu_handle_fstat64_ret' not in content:
                  decls.append('extern int ksu_handle_fstat64_ret(struct kstat *stat);')
              if decls:
                  block = '#ifdef CONFIG_KSU\\n' + '\\n'.join(decls) + '\\n#endif\\n'
                  content = content.replace('#include <linux/susfs_def.h>\\n', '#include <linux/susfs_def.h>\\n' + block)
                  with open('fs/stat.c', 'w') as f:
                      f.write(content)
                  print(f'  fs/stat.c: 已添加 stat hook 声明')
              else:
                  print('  fs/stat.c: stat hook 声明已存在或无需添加')

          print('[+] Hook 处理完成')
          PYEOF

          python3 /tmp/fix_hooks.py

          echo "[+] 验证 required hooks ..."
          all_ok=true
          for file in fs/exec.c fs/open.c fs/stat.c fs/read_write.c kernel/reboot.c drivers/input/input.c; do
            [ -f "$file" ] || continue
            case $file in
              fs/exec.c) expected="ksu_handle_execveat" ;;
              fs/open.c) expected="ksu_handle_faccessat" ;;
              fs/stat.c) expected="ksu_handle_stat" ;;
              fs/read_write.c) expected="ksu_handle_sys_read" ;;
              kernel/reboot.c) expected="ksu_handle_sys_reboot" ;;
              drivers/input/input.c) expected="ksu_handle_input_handle_event" ;;
            esac
            if grep -q "$expected" "$file"; then
              echo "  ✅ $file: $expected"
            else
              echo "  ❌ $file: $expected 缺失"
              all_ok=false
            fi
          done
          echo "  ⏳ kernel/sys.c: ksu_handle_setresuid 将由步骤 6.9 处理"
          if [ "$all_ok" = false ]; then
            echo "::error::部分 required hook 缺失"
            exit 1
          fi

      # ── 6.9 修补 kernel/sys.c 缺失的 ksu_handle_setresuid hook ──
      - name: 修补 kernel/sys.c setresuid hook
        if: inputs.ksu_enabled && inputs.susfs_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          echo "[+] 检查并修补 kernel/sys.c 中的 ksu_handle_setresuid hook ..."

          if grep -q "ksu_handle_setresuid" kernel/sys.c; then
            echo "  kernel/sys.c 已存在 ksu_handle_setresuid，跳过"
            exit 0
          fi

          echo "  kernel/sys.c 缺少 ksu_handle_setresuid，正在修补 ..."

          cat > /tmp/patch_sys_c.py << 'PYEOF'
          import re
          import sys

          with open('kernel/sys.c', 'r') as f:
              content = f.read()

          # 在 SYSCALL_DEFINE3(setresuid, ...) 的 { 后面插入 hook
          pattern = r'(SYSCALL_DEFINE3\s*\(\s*setresuid\s*,\s*uid_t\s*,\s*ruid\s*,\s*uid_t\s*,\s*euid\s*,\s*uid_t\s*,\s*suid\s*\)\s*\{)'
          hook = r'''\1
              #ifdef CONFIG_KSU
              extern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);
              if (ksu_handle_setresuid(ruid, euid, suid)) {
                  pr_info("Something wrong with ksu_handle_setresuid()\\n");
              }
              #endif
          '''

          if 'ksu_handle_setresuid' in content:
              print("  kernel/sys.c 已存在 ksu_handle_setresuid")
              sys.exit(0)

          if not re.search(pattern, content):
              print("::error::无法在 kernel/sys.c 中找到 SYSCALL_DEFINE3(setresuid)")
              sys.exit(1)

          content = re.sub(pattern, hook, content, count=1)

          with open('kernel/sys.c', 'w') as f:
              f.write(content)

          print("  kernel/sys.c 修补成功")
          PYEOF

          python3 /tmp/patch_sys_c.py

          if grep -q "ksu_handle_setresuid" kernel/sys.c; then
            echo "  kernel/sys.c 验证通过"
          else
            echo "::error::kernel/sys.c 修补失败"
            exit 1
          fi
      # ── 7. 集成 Droidspaces 支持 ──
      - name: 集成 Droidspaces 支持
        if: inputs.droidspaces_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail

          PATCH_SRC="${{ github.workspace }}/droidspaces-src"
          rm -rf "$PATCH_SRC"
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/seriaTvT/Droidspaces-OSS "$PATCH_SRC"
          git -C "$PATCH_SRC" sparse-checkout set \
            Documentation/resources/kernel-patches/non-GKI
          NON_GKI="$PATCH_SRC/Documentation/resources/kernel-patches/non-GKI"

          shopt -s nullglob
          for patch in "$NON_GKI"/*.patch; do
            name="$(basename "$patch")"
            mapfile -t targets < <(grep '^+++ ' "$patch" | sed -E 's#^\+\+\+ b/##; s/\t.*$//')

            if git apply --reverse --check "$patch" >/dev/null 2>&1; then
              echo "✅ 已应用，跳过: $name"
              continue
            fi

            if git apply --check "$patch" >/dev/null 2>&1; then
              git apply "$patch"
              echo "✅ 应用成功: $name"
              continue
            fi

            missing_all=true
            for t in "${targets[@]}"; do
              [ -e "$t" ] && missing_all=false
            done
            if [ "$missing_all" = true ]; then
              echo "⚠️  目标文件不存在，跳过不适用补丁: $name (${targets[*]:-?})"
              continue
            fi

            echo "::error::补丁无法应用（疑似源码冲突）: $name"
            exit 1
          done

          DEFCONFIG="arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          if grep -q "Droidspaces support (non-GKI)" "$DEFCONFIG"; then
            echo "Droidspaces 内核配置已存在，跳过追加"
          else
          cat >> "$DEFCONFIG" << 'EOF'

          # ===== Droidspaces support (non-GKI) =====
          CONFIG_FHANDLE=y
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_HL=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_IP_NF_TARGET_ULOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_NETFILTER_NETLINK_LOG=y
          CONFIG_NETFILTER_XT_TARGET_NFLOG=y
          EOF
          fi

          echo "已写入 Droidspaces 内核配置:"
          cat "$DEFCONFIG"

      # ── 8. 版本伪装 ──
      - name: 伪装内核版本信息
        if: inputs.fake_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          IN_BUILD_USER: ${{ inputs.kbuild_build_user }}
          IN_BUILD_HOST: ${{ inputs.kbuild_build_host }}
          IN_BUILD_TIMESTAMP: ${{ inputs.kbuild_build_timestamp }}
          IN_BUILD_VERSION: ${{ inputs.kbuild_build_version }}
        run: |
          if [ -n "$IN_BUILD_USER" ];      then echo "KBUILD_BUILD_USER=$IN_BUILD_USER"           >> "$GITHUB_ENV"; fi
          if [ -n "$IN_BUILD_HOST" ];      then echo "KBUILD_BUILD_HOST=$IN_BUILD_HOST"           >> "$GITHUB_ENV"; fi
          if [ -n "$IN_BUILD_TIMESTAMP" ]; then echo "KBUILD_BUILD_TIMESTAMP=$IN_BUILD_TIMESTAMP" >> "$GITHUB_ENV"; fi
          if [ -n "$IN_BUILD_VERSION" ];   then echo "KBUILD_BUILD_VERSION=$IN_BUILD_VERSION"     >> "$GITHUB_ENV"; fi

          if [ -n "${FAKE_EXTRAVERSION}" ]; then
            ESCAPED_EXTRA=$(printf '%s\n' "${FAKE_EXTRAVERSION}" | sed 's/[&/\\]/\\&/g')
            sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = ${ESCAPED_EXTRA}/" Makefile
            sed -i '2i exit 0' scripts/setlocalversion
          fi

          if [ -n "${FAKE_COMPILER}" ]; then
            ESCAPED_COMPILER=$(printf '%s\n' "${FAKE_COMPILER}" | sed 's/[&|\\]/\\&/g')
            if ! grep -q '"\$CC_VERSION, \$LD_VERSION"' scripts/mkcompile_h; then
              echo "::error::未在 scripts/mkcompile_h 找到预期的 LINUX_COMPILER 拼接串，伪装编译器失败"
              exit 1
            fi
            sed -i "s|\"\$CC_VERSION, \$LD_VERSION\"|\"${ESCAPED_COMPILER}\"|" scripts/mkcompile_h
          fi

      # ── 9. 编译内核 ──
      - name: 生成 defconfig
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          if [[ "${{ inputs.ccache_enabled }}" == "true" ]]; then
            CC_CMD="ccache clang"
          else
            CC_CMD="clang"
          fi

          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC="${CC_CMD}" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            OBJSIZE=llvm-size \
            ${{ env.DEFCONFIG_NAME }}

          echo "[+] 强制启用 SUSFS 配置..."
          cd ${{ env.OUT_DIR }}
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          ${GITHUB_WORKSPACE}/${{ env.KERNEL_NAME }}/scripts/config --enable CONFIG_KSU_SUSFS_SUS_MAP
          
          # 同步依赖（如果依赖不满足会报错，而不是静默取消）
          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC="${CC_CMD}" \
            oldconfig < /dev/null || true
          
          # 验证
          echo "=== 验证 SUSFS 配置 ==="
          grep "CONFIG_KSU_SUSFS" .config | head -20
          # =====================================================

            - name: 编译内核与设备树
          working-directory: ${{ env.KERNEL_NAME }}
          run: |
          # 强制删除 config 相关缓存，确保 config.gz 随 .config 更新
          rm -f ${{ env.OUT_DIR }}/kernel/configs.o
          rm -f ${{ env.OUT_DIR }}/kernel/configs.s
          rm -f ${{ env.OUT_DIR }}/include/generated/autoconf.h
          rm -f ${{ env.OUT_DIR }}/include/config/auto.conf
          rm -f ${{ env.OUT_DIR }}/include/config/auto.conf.cmd

          # 编译前最终验证
          echo "=== 编译前最终验证 .config ==="
          grep "CONFIG_KSU_SUSFS" ${{ env.OUT_DIR }}/.config

          if [[ "${{ inputs.ccache_enabled }}" == "true" ]]; then
            CC_CMD="ccache clang"
            ccache -z
          else
            CC_CMD="clang"
          fi
          
          # ... 后续编译命令不变

          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC="${CC_CMD}" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            OBJSIZE=llvm-size \
            Image dtbs

      - name: 输出 ccache 统计
        if: inputs.ccache_enabled && always()
        run: ccache -s

      # ── 10. 保存 ccache ──
      - name: 保存 ccache 缓存
        if: inputs.ccache_enabled
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      # ── 11. 准备产物 ──
      - name: 校验内核与设备树镜像
        id: prepare_image
        run: |
          BOOT_DIR="${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot"
          BUILDDATE="${{ steps.setup_env.outputs.builddate }}"
          SUFFIX="${{ inputs.kernel_suffix }}"
          SUFFIX_STR="${SUFFIX:+-${SUFFIX}}"
          IMAGE_NAME="Image-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}${SUFFIX_STR}-${BUILDDATE}"
          DTB_NAME="dtb-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}${SUFFIX_STR}-${BUILDDATE}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "dtb_name=${DTB_NAME}" >> $GITHUB_OUTPUT

          if [[ ! -f "${BOOT_DIR}/Image" ]]; then
            echo "::error::未找到内核镜像文件 (Image)，构建失败"
            exit 1
          fi
          echo "内核镜像校验通过: ${BOOT_DIR}/Image"

          find "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dts/" -name "*.dtb" -type f -exec cat {} + > "${BOOT_DIR}/dtb"

          if [[ ! -s "${BOOT_DIR}/dtb" ]]; then
            echo "::error::未找到编译出的 DTB 文件，构建失败"
            exit 1
          fi
          echo "DTB 文件校验及合并通过: ${BOOT_DIR}/dtb"

      - name: 打包 AnyKernel3
        if: inputs.use_anykernel
        id: pack_anykernel
        run: |
          BOOT_DIR="${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot"
          # 验证 Image 确实包含 SUSFS 配置
          echo "=== Image 中的 SUSFS 配置 ==="
          strings "${BOOT_DIR}/Image" | grep "CONFIG_KSU_SUSFS" | head -5
          
          # 验证 Image 修改时间
          echo "=== Image 生成时间 ==="
          ls -la "${BOOT_DIR}/Image"
          BUILDDATE="${{ steps.setup_env.outputs.builddate }}"
          SUFFIX="${{ inputs.kernel_suffix }}"
          SUFFIX_STR="${SUFFIX:+-${SUFFIX}}"
          AK3_NAME="${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}${SUFFIX_STR}_${BUILDDATE}"

          if [ -f "${BOOT_DIR}/Image" ]; then
            cp -f "${BOOT_DIR}/Image" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/Image.gz" ]; then
            cp -f "${BOOT_DIR}/Image.gz" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/dtb" ]; then
            cp -f "${BOOT_DIR}/dtb" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/dtbo" ]; then
            cp -f "${BOOT_DIR}/dtbo" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/dtbo.img" ]; then
            cp -f "${BOOT_DIR}/dtbo.img" ./AnyKernel3/
          fi

          cd AnyKernel3/
          zip -q -r "${{ github.workspace }}/${AK3_NAME}.zip" *
          echo "ak3name=${AK3_NAME}.zip" >> $GITHUB_OUTPUT

      # ── 12. 上传产物 ──
      - name: 上传 AnyKernel3 刷入包
        if: inputs.use_anykernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack_anykernel.outputs.ak3name }}
          path: ${{ github.workspace }}/${{ steps.pack_anykernel.outputs.ak3name }}
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_image.outputs.image_name }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: 上传 dtb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_image.outputs.dtb_name }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  #  发布 Release
  # ============================================================
  release:
    name: 发布 Release
    if: inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./release_files

      - name: 设置发布环境变量
        run: |
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_HEAD="chopin-build"

          if [[ -n "${{ inputs.kernel_suffix }}" ]]; then
            FULL_VERSION="${{ env.KERNEL_NAME }}-${{ inputs.kernel_suffix }}"
          else
            FULL_VERSION="${{ env.KERNEL_NAME }}"
          fi

          if [[ "${{ inputs.ksu_enabled }}" == "true" ]]; then
            KSU_STATUS="ReSukiSU (Manual Hook)"
          else
            KSU_STATUS="未集成"
          fi

          if [[ "${{ inputs.susfs_enabled }}" == "true" && "${{ inputs.ksu_enabled }}" == "true" ]]; then
            SUSFS_STATUS="已集成 (v1.4.2-kernel-4.14)"
          else
            SUSFS_STATUS="未集成"
          fi

          if [[ "${{ inputs.droidspaces_enabled }}" == "true" ]]; then
            DS_STATUS="已集成 (官方补丁 + 内核配置)"
          else
            DS_STATUS="未集成"
          fi

          if [[ "${{ inputs.fake_enabled }}" == "true" ]]; then
            FAKE_INFO="${{ inputs.kbuild_build_user }}@${{ inputs.kbuild_build_host }}"
            FAKE_TIME="${{ inputs.kbuild_build_timestamp }}"
            FAKE_VER="${{ inputs.kbuild_build_version }}"
          else
            FAKE_INFO="未伪装（真实环境）"
            FAKE_TIME="未伪装（真实环境）"
            FAKE_VER="未伪装（真实环境）"
          fi

          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "KSU_STATUS=$KSU_STATUS" >> $GITHUB_ENV
          echo "SUSFS_STATUS=$SUSFS_STATUS" >> $GITHUB_ENV
          echo "DS_STATUS=$DS_STATUS" >> $GITHUB_ENV
          echo "FAKE_INFO=$FAKE_INFO" >> $GITHUB_ENV
          echo "FAKE_TIME=$FAKE_TIME" >> $GITHUB_ENV
          echo "FAKE_VER=$FAKE_VER" >> $GITHUB_ENV

      - name: 创建 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 构建信息
          - 设备: chopin (Redmi Note 10 Pro / POCO X3 GT)
          - 内核分支: ${{ env.KERNEL_BRANCH }}
          - 内核版本: ${{ env.FULL_VERSION }}
          - 编译时间: ${{ env.TIME_FORM }}
          - KernelSU: ${{ env.KSU_STATUS }}
          - SUSFS: ${{ env.SUSFS_STATUS }}
          - Droidspaces: ${{ env.DS_STATUS }}
          - AnyKernel3 打包: ${{ inputs.use_anykernel }}
          - CCache 加速: ${{ inputs.ccache_enabled }}
          - 伪装启用: ${{ inputs.fake_enabled }}
          - 伪装信息: ${{ env.FAKE_INFO }}
          - 伪装时间: ${{ env.FAKE_TIME }}
          - 伪装版本: ${{ env.FAKE_VER }}
          EOF

          shopt -s nullglob
          RELEASE_FILES=()

          for f in ./release_files/*/*.zip; do
            RELEASE_FILES+=("$f")
          done
          for f in ./release_files/*/Image; do
            RELEASE_FILES+=("$f")
          done
          for f in ./release_files/*/dtb; do
            RELEASE_FILES+=("$f")
          done

          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "::error::未找到任何可发布的文件"
            exit 1
          fi

          echo "即将发布以下文件:"
          printf '  - %s\n' "${RELEASE_FILES[@]}"

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.FULL_VERSION }}-${{ env.TIME }}" \
            --notes-file release_notes.md \
            "${RELEASE_FILES[@]}"
